<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote TV — mode local requis</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #0b1220; color: #e8eefc;
    }
    main {
      max-width: 36rem; padding: 2rem; border: 1px solid #243047;
      border-radius: 1rem; background: #121a2b;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
    p { line-height: 1.5; color: #a9b7d0; margin: 0 0 0.75rem; }
    code {
      display: block; padding: 0.85rem 1rem; border-radius: 0.75rem;
      background: #0b1220; color: #9ad1ff; overflow-x: auto;
      font-size: 0.9rem;
    }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>Contrôle TV = mode local</h1>
    <p>
      Cette démo Vercel affiche l’interface. Piloter une vraie télé (Wi‑Fi / ADB / Bluetooth)
      nécessite le serveur sur le même réseau que la télé.
    </p>
    <code>git clone https://github.com/samkompany/remote-tv.git
cd remote-tv
npm install
npm start</code>
    <p>Puis ouvre <a href="http://localhost:3000">http://localhost:3000</a>.</p>
  </main>
</body>
</html>
